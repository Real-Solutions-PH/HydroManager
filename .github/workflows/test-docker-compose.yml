name: Test Docker Compose

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize

jobs:

  test-docker-compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      # .env is gitignored, so CI has to materialise one. Without it every
      # compose command fails during interpolation on the required variables
      # (POSTGRES_PASSWORD, MINIO_ROOT_USER, ...).
      - name: Create .env
        run: cp .env.example .env
      - run: docker compose build
      - run: docker compose down -v --remove-orphans
      - run: docker compose up -d --wait backend frontend
      - name: Test backend is up
        run: curl --fail --retry 10 --retry-all-errors --retry-delay 3 http://localhost:8000/api/v1/utils/health-check/
      # frontend has no healthcheck, so --wait only proves the container is
      # running; retry while the Next.js dev server finishes booting.
      - name: Test frontend is up
        run: curl --fail --retry 10 --retry-all-errors --retry-delay 3 http://localhost:3000
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color
      - run: docker compose down -v --remove-orphans
        if: always()
